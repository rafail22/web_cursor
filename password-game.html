<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Impossible Password // Formulir Paling Nyebelin</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/password-game.css">
</head>
<body class="password-game-page">

  <!-- Header -->
  <header class="pwd-header">
    <div class="pwd-badge">⚠️ UJI KESABARAN MAKSIMAL</div>
    <h1 class="pwd-title">THE IMPOSSIBLE PASSWORD</h1>
    <p class="pwd-desc">Buat kata sandi sederhana yang memenuhi seluruh standar keamanan 'masuk akal' kami.</p>
  </header>

  <!-- Main Card -->
  <main class="pwd-form-card">
    <div class="pwd-input-group">
      <label for="pwdInput" class="pwd-label">
        <span>KATA SANDI AKUN ANDA</span>
        <span class="char-counter" id="charCounter">0 karakter</span>
      </label>
      <div class="pwd-input-wrapper">
        <input 
          type="text" 
          id="pwdInput" 
          class="pwd-input" 
          placeholder="Mulai ketik kata sandi..." 
          spellcheck="false" 
          autocomplete="off" 
          autofocus 
        />
      </div>
    </div>

    <!-- Live Rules Checklist Container -->
    <div class="rules-container" id="rulesContainer">
      <!-- Dynamic rule cards inserted here -->
    </div>

    <!-- Submit Button with Countdown -->
    <button class="btn-submit-pwd" id="submitBtn" disabled>
      KIRIM PENDAFTARAN (LENGKAPI SEMUA ATURAN)
    </button>
  </main>

  <!-- Victory Modal -->
  <div class="pwd-modal-overlay" id="pwdModal">
    <div class="pwd-modal-card">
      <h2>🎉 KEAJAIBAN DUNIA TERJADI!</h2>
      <p>
        Anda secara ajaib berhasil menciptakan kata sandi paling rumit dan mustahil dalam sejarah komputasi tanpa membuat kepala meledak!
      </p>
      <button class="btn-pwd-retry" id="retryBtn">Ulangi Dari Awal 😈</button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/audio-fx.js"></script>
  <script src="js/nav-bar.js"></script>
  <script src="js/password-game.js"></script>
</body>
</html>
